version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "Snr-Dave"
    labels:
      - "dependencies"
      - "automated"
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
        
